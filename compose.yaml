services:
  bot:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_PATH: /app/data/pushups.sqlite3
      # Нормы этой группы из опубликованных отчётов. Пустое значение в .env задаёт чистую историю.
      DAILY_TARGET_HISTORY: "${DAILY_TARGET_HISTORY-2026-11-24=30,2026-11-25=40}"

    volumes:
      - ./data:/app/data

    mem_limit: 1536m
    cpus: 2.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
